:root {
  color-scheme: light;
}
body {
  background: var(--color-page);
  color: var(--color-ink);
  font-size: 1.0625rem;
}
.fade-in {
  animation: fade-in .45s ease both;
}
@keyframes fade-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}
.presenter {
  animation: fade-in .9s ease both;
}
.presenter-img {
  mask-image: linear-gradient(to bottom, #000 62%, rgb(0 0 0 / .55) 82%, transparent 99%);
  filter: drop-shadow(0 12px 30px rgb(37 99 235 / .18));
}
.orbit {
  animation: spin-slow 48s linear infinite;
  transform-origin: center;
}
@keyframes spin-slow {
  from {
    rotate: 0deg;
  }
  to {
    rotate: 360deg;
  }
}
@media (prefers-reduced-motion: reduce) {
  .orbit, .fade-in, .presenter {
    animation: none !important;
  }
}
.confetti {
  position: absolute;
  top: -5vh;
  animation: fall linear both;
}
@keyframes fall {
  to {
    transform: translate3d(var(--dx), 115vh, 0) rotate(var(--rot));
  }
}
.pop {
  animation: pop .65s cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes pop {
  from {
    opacity: 0;
    transform: scale(.4);
  }
}
.ring-burst {
  animation: burst 1.4s ease-out infinite;
}
@keyframes burst {
  from {
    opacity: .8;
    transform: scale(.5);
  }
  to {
    opacity: 0;
    transform: scale(2.2);
  }
}
.fade-out {
  animation: fade-out .5s ease 3.5s forwards;
}
@keyframes fade-out {
  to {
    opacity: 0;
    visibility: hidden;
  }
}
.shake {
  animation: shake .5s ease 2;
}
@keyframes shake {
  25% {
    translate: -8px 0;
  }
  75% {
    translate: 8px 0;
  }
}
.dna-a, .dna-b, .dna-rung {
  transform-box: fill-box;
  transform-origin: center;
  animation: 5s cubic-bezier(.37, 0, .63, 1) infinite alternate;
  will-change: transform;
}
.dna-a {
  animation-name: dna-a;
}
.dna-b {
  animation-name: dna-b;
}
.dna-rung {
  animation-name: dna-rung;
}
@keyframes dna-a {
  from {
    transform: translateX(-36px) scale(1);
  }
  50% {
    scale: 1.3;
  }
  to {
    transform: translateX(36px) scale(1);
  }
}
@keyframes dna-b {
  from {
    transform: translateX(36px) scale(1);
  }
  50% {
    scale: .7;
  }
  to {
    transform: translateX(-36px) scale(1);
  }
}
@keyframes dna-rung {
  from {
    transform: scaleX(1);
  }
  to {
    transform: scaleX(-1);
  }
}
@media (prefers-reduced-motion: reduce) {
  .dna-a, .dna-b, .dna-rung {
    animation: none !important;
  }
}
